[project]
name = "typeless-local"
version = "0.1.0"
description = "Typeless-like local voice dictation: whisper.cpp (Vulkan GPU) + LLM rephrase"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=2.0",
    "pynput>=1.7.7",
    "pyperclip>=1.9",
]

[project.scripts]
typeless-server = "server.main:main"
typeless-dictate = "app.dictate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "app"]
